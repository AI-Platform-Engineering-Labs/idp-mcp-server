name: images

# Builds the Backstage and MCP server images and publishes them to GitHub's
# container registry (GHCR) on every merge to main, for amd64 (AKS, Intel) and arm64 (Apple Silicon). AKS and the local
# Terraform stack (image_source = "ghcr") pull them from there.
# Why GHCR: the KodeKloud playground blocks ACR build tasks and role assignments
# (so AKS can't be attached to an ACR), but it can pull public images.
on:
  push:
    branches: [main]
    paths: ["backstage/**", "server/**", "Dockerfile", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: idp-backstage
            context: backstage
          - image: idp-mcp-server
            context: .
    steps:
      - uses: actions/checkout@v4
      # QEMU lets the amd64 runner build the arm64 variant (Apple Silicon Macs).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # amd64 = AKS, Intel/Windows/Linux; arm64 = Apple Silicon Macs
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ai-platform-engineering-labs/${{ matrix.image }}:latest
            ghcr.io/ai-platform-engineering-labs/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Check the image is public (AKS pulls without credentials)
        run: |
          TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:ai-platform-engineering-labs/${{ matrix.image }}:pull" | jq -r .token)
          if curl -fsS -o /dev/null -H "Authorization: Bearer $TOKEN" \
               "https://ghcr.io/v2/ai-platform-engineering-labs/${{ matrix.image }}/manifests/latest" \
               -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json"; then
            echo "Public: anyone can pull ghcr.io/ai-platform-engineering-labs/${{ matrix.image }}"
          else
            echo "::warning::The package ${{ matrix.image }} is private. Make it public once: GitHub org > Packages > ${{ matrix.image }} > Package settings > Change visibility > Public."
          fi
