# The software catalog: the services running on the platform.
# Each one runs in the cluster with NO public address. The only way to reach it is
# the Backstage proxy at /api/proxy/svc/<name>/ (see proxy.endpoints in app-config.yaml),
# which is how the MCP server's get_service_status tool checks a service.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: shop
  description: The demo online shop
spec:
  owner: team-platform
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: payments-api
  description: Takes card payments for orders
  annotations:
    idp.demo/tier: critical
    idp.demo/oncall: payments-oncall@example.com
  tags: [python]
  links:
    - url: https://runbooks.example.com/payments-api
      title: Runbook
    - url: https://grafana.example.com/d/payments-api
      title: Dashboard
spec:
  type: service
  lifecycle: production
  owner: team-payments
  system: shop
  providesApis: [payments-openapi]
  dependsOn:
    - component:customers-api
    - resource:payments-db
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: customers-api
  description: Customer profiles and contact details (personal data)
  annotations:
    idp.demo/tier: critical
    idp.demo/oncall: payments-oncall@example.com
  tags: [java]
  links:
    - url: https://runbooks.example.com/customers-api
      title: Runbook
spec:
  type: service
  lifecycle: production
  owner: team-payments
  system: shop
  providesApis: [customers-openapi]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: orders-web
  description: Storefront web app where customers place orders
  annotations:
    idp.demo/tier: standard
    idp.demo/oncall: storefront-oncall@example.com
  tags: [node]
  links:
    - url: https://runbooks.example.com/orders-web
      title: Runbook
spec:
  type: website
  lifecycle: production
  owner: team-storefront
  system: shop
  consumesApis: [payments-openapi]
  dependsOn:
    - component:payments-api
    - component:customers-api
    - resource:orders-db
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: notifications-worker
  description: Sends order and shipping emails
  annotations:
    idp.demo/tier: standard
    idp.demo/oncall: platform-oncall@example.com
  tags: [go]
  links:
    - url: https://runbooks.example.com/notifications-worker
      title: Runbook
spec:
  type: service
  lifecycle: experimental
  owner: team-platform
  system: shop
  dependsOn:
    - component:orders-web
    - resource:events-bus
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: idp-mcp-server
  description: MCP server that gives AI agents safe access to this platform
  tags: [python, mcp]
spec:
  type: service
  lifecycle: experimental
  owner: team-platform
  system: shop
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: payments-db
  description: PostgreSQL database for payments (managed service, restricted data)
spec:
  type: database
  owner: team-payments
  system: shop
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: payments-openapi
  description: Public contract of payments-api (create and capture payments, idempotent)
  tags: [openapi, payments]
spec:
  type: openapi
  lifecycle: production
  owner: team-payments
  system: shop
  definition: |
    openapi: 3.0.3
    info:
      title: payments-api
      version: 1.0.0
    paths:
      /v1/payments:
        post:
          summary: Create a payment (requires an Idempotency-Key header)
          responses:
            "201": {description: Created}
      /healthz:
        get:
          summary: Health check
          responses:
            "200": {description: OK}
---
# The company handbook. The "Docs" tab renders backstage/catalog/docs (mkdocs) as a site.
# The MCP server serves the same Markdown files through search_docs / get_doc.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: engineering-handbook
  title: Skyline Engineering Handbook
  description: Onboarding, golden paths, standards and runbooks. Internal knowledge, not on the internet.
  annotations:
    backstage.io/techdocs-ref: dir:./docs
  tags: [docs, onboarding, runbooks]
spec:
  type: documentation
  lifecycle: production
  owner: team-platform
  system: shop
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: orders-db
  description: PostgreSQL database behind the orders flow
spec:
  type: database
  owner: team-storefront
  system: shop
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: events-bus
  description: Message bus carrying order and payment events to the notifications worker
spec:
  type: message-queue
  owner: team-platform
  system: shop
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: customers-openapi
  description: Customer profile lookups (REST)
spec:
  type: openapi
  lifecycle: production
  owner: team-payments
  system: shop
  definition: |
    openapi: 3.0.0
    info:
      title: Customers API
      version: 1.0.0
    paths:
      /customers/{id}:
        get:
          summary: Get a customer profile
          parameters:
            - { name: id, in: path, required: true, schema: { type: string } }
          responses:
            '200': { description: The customer profile }
