# The software catalog: the services running on the platform.
# Annotation idp.demo/ai-access decides what an AI agent may do (enforced by the MCP server):
#   open    - the agent may call the service
#   guarded - the agent sees it in the catalog but call_service refuses it
# A component without the annotation is treated as guarded (default deny).
# Each one runs in the cluster with NO public address. The only way to reach it is
# the Backstage proxy at /api/proxy/svc/<name>/ (see proxy.endpoints in app-config.yaml),
# which is exactly what the MCP server's call_service tool uses.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: shop
  description: The demo online shop
spec:
  owner: team-platform
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: payments-api
  description: Takes card payments for orders
  annotations:
    idp.demo/tier: critical
    idp.demo/ai-access: guarded
  tags: [python]
spec:
  type: service
  lifecycle: production
  owner: team-payments
  system: shop
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: customers-api
  description: Customer profiles and contact details (personal data)
  annotations:
    idp.demo/tier: critical
    idp.demo/ai-access: guarded
  tags: [java]
spec:
  type: service
  lifecycle: production
  owner: team-payments
  system: shop
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: orders-web
  description: Storefront web app where customers place orders
  annotations:
    idp.demo/tier: standard
    idp.demo/ai-access: open
  tags: [node]
spec:
  type: website
  lifecycle: production
  owner: team-storefront
  system: shop
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: notifications-worker
  description: Sends order and shipping emails
  annotations:
    idp.demo/tier: standard
    idp.demo/ai-access: open
  tags: [go]
spec:
  type: service
  lifecycle: experimental
  owner: team-platform
  system: shop
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: idp-mcp-server
  description: MCP server that gives AI agents safe access to this platform
  tags: [python, mcp]
spec:
  type: service
  lifecycle: experimental
  owner: team-platform
  system: shop
