# The software catalog: the services running on the platform.
# Each one runs in the cluster with NO public address. The only way to reach it is
# the Backstage proxy at /api/proxy/svc/<name>/ (see proxy.endpoints in app-config.yaml),
# which is how the MCP server's get_service_status tool checks a service.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: shop
  description: The demo online shop
spec:
  owner: team-platform
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: payments-api
  description: Takes card payments for orders
  annotations:
    idp.demo/tier: critical
    idp.demo/oncall: payments-oncall@example.com
  tags: [python]
  links:
    - url: https://runbooks.example.com/payments-api
      title: Runbook
    - url: https://grafana.example.com/d/payments-api
      title: Dashboard
spec:
  type: service
  lifecycle: production
  owner: team-payments
  system: shop
  dependsOn:
    - component:customers-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: customers-api
  description: Customer profiles and contact details (personal data)
  annotations:
    idp.demo/tier: critical
    idp.demo/oncall: payments-oncall@example.com
  tags: [java]
  links:
    - url: https://runbooks.example.com/customers-api
      title: Runbook
spec:
  type: service
  lifecycle: production
  owner: team-payments
  system: shop
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: orders-web
  description: Storefront web app where customers place orders
  annotations:
    idp.demo/tier: standard
    idp.demo/oncall: storefront-oncall@example.com
  tags: [node]
  links:
    - url: https://runbooks.example.com/orders-web
      title: Runbook
spec:
  type: website
  lifecycle: production
  owner: team-storefront
  system: shop
  dependsOn:
    - component:payments-api
    - component:customers-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: notifications-worker
  description: Sends order and shipping emails
  annotations:
    idp.demo/tier: standard
    idp.demo/oncall: platform-oncall@example.com
  tags: [go]
  links:
    - url: https://runbooks.example.com/notifications-worker
      title: Runbook
spec:
  type: service
  lifecycle: experimental
  owner: team-platform
  system: shop
  dependsOn:
    - component:orders-web
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: idp-mcp-server
  description: MCP server that gives AI agents safe access to this platform
  tags: [python, mcp]
spec:
  type: service
  lifecycle: experimental
  owner: team-platform
  system: shop
