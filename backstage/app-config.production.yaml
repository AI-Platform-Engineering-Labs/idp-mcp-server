# Overrides for the container image (docker compose, local Terraform, AKS).
# Values come from environment variables set by the deployment.

app:
  # The URL people open in the browser, e.g. http://20.1.2.3 on AKS.
  baseUrl: ${BACKSTAGE_BASE_URL}

backend:
  baseUrl: ${BACKSTAGE_BASE_URL}
  listen: ':7007'
  cors:
    origin: ${BACKSTAGE_BASE_URL}
  # Demo: an in-memory database. The catalog is re-read from the files in
  # ./catalog on every start, so nothing is lost that matters here.
  # A real IDP would use PostgreSQL (see the Backstage docs).
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  providers:
    # Demo only: anyone who can open the URL signs in as "guest".
    # A real IDP would use your SSO (Entra ID, GitHub, ...).
    guest:
      dangerouslyAllowOutsideDevelopment: true

catalog:
  locations:
    # Paths are relative to the working directory in the image (/app).
    - type: file
      target: ./catalog/services.yaml
    - type: file
      target: ./catalog/templates.yaml
    - type: file
      target: ./catalog/org.yaml
      rules:
        - allow: [User, Group]
