# The MCP server: the AI agent's way into the IDP. Public (LoadBalancer) so
# VS Code / Claude on your laptop can connect to http://<ip>/mcp.
# It reaches Backstage inside the cluster with a token Backstage only accepts
# for the catalog and proxy plugins.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels: {app: mcp-server}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mcp-server}
  template:
    metadata:
      labels: {app: mcp-server}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mcp-server
          image: idp-mcp-server
          ports: [{containerPort: 8000}]
          env:
            - {name: MCP_TRANSPORT, value: http}
            - {name: BACKSTAGE_URL, value: "http://backstage:7007"}
            - name: BACKSTAGE_TOKEN
              valueFrom: {secretKeyRef: {name: idp-tokens, key: mcp-backstage-token}}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
spec:
  type: LoadBalancer
  selector: {app: mcp-server}
  ports:
    - {name: http, port: 80, targetPort: 8000}
