# The platform's services. They are ClusterIP only (no public address) and the
# NetworkPolicy lets only Backstage reach them: the IDP is the only way in.
# Each one is a tiny echo server standing in for a real app.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  labels: {app: payments-api, idp.demo/role: service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: payments-api}
  template:
    metadata:
      labels: {app: payments-api, idp.demo/role: service, idp.demo/owner: team-payments}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", '-text={"service":"payments-api","owner":"team-payments","status":"healthy"}']
          ports: [{containerPort: 5678}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /, port: 5678}}
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
spec:
  type: ClusterIP
  selector: {app: payments-api}
  ports: [{port: 5678, targetPort: 5678}]
